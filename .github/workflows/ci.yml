name: AgentDesk CI Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]

jobs:
  quality-checks:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm Store Directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Database Schemas
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/agentdesk_ci?schema=public"
        run: pnpm --filter backend exec prisma validate

      - name: Check Backend TypeScript Compilation
        run: pnpm --filter backend exec tsc --noEmit

      - name: Check Frontend TypeScript Compilation
        run: pnpm --filter web exec tsc --noEmit

  database-and-tests:
    name: Postgres pgvector Test Runner
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: agentdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable pgvector Extension in Test Database
        run: docker run --net=host -e PGPASSWORD=postgrespassword pgvector/pgvector:pg16 psql -h 127.0.0.1 -U postgres -d agentdesk_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Push Schema to Test Database
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/agentdesk_test?schema=public
        run: pnpm --filter backend exec prisma db push --accept-data-loss
